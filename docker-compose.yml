services:
  agent-explorer:
    build: .
    container_name: agent-explorer
    volumes:
      - .:/app
    ports:
      - "1234:1234"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1      # real-time stdout logs
      - PYTHONDONTWRITEBYTECODE=1

    stdin_open: true
    tty: true
